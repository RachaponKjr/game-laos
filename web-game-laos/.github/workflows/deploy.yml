name: Deploy Next.js to Docker via SSH

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ขั้นตอนนี้จะช่วยสร้างไฟล์ .env หรือจัดการไฟล์ที่ไม่ต้องการให้ทับกัน (เช่น .db)
      - name: Setup Environment
        run: |
          echo "NODE_ENV=production" > .env
          # หากมีไฟล์ .db ให้แน่ใจว่ามันอยู่ใน .dockerignore เพื่อไม่ให้ทับของจริงบน Server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # (Optional) ถ้าคุณใช้ Docker Hub หรือ Private Registry ให้ Login ที่นี่
      # แต่ถ้าจะ Build แล้วส่งไฟล์ไปเฉยๆ หรือ Build บน Server เลย ให้ข้ามไปขั้นตอน SSH

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. เข้าไปที่โฟลเดอร์โปรเจกต์บน Server
            cd /path/to/your/project 

            # 2. ดึง Code ล่าสุด (กรณีใช้ Git บน Server ด้วย)
            git pull origin main

            # 3. สั่ง Build Image และ Restart Container
            # --build จะช่วยให้ Docker สร้าง Image ใหม่ตาม Code ที่อัปเดต
            docker-compose up -d --build

            # 4. เคลียร์ Image เก่าๆ ที่ไม่ได้ใช้เพื่อประหยัดพื้นที่
            docker image prune -f
