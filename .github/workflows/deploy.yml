name: Deploy Fullstack Game App

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & Push Web Client (ส่ง ARG สำหรับ build-time env)
      - name: Build and Push Web
        uses: docker/build-push-action@v5
        with:
          context: ./web-game-laos
          file: ./web-game-laos/Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/game-web:latest

      # Build & Push Dashboard
      - name: Build and Push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard-game
          file: ./dashboard-game/Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/game-dashboard:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. เข้าไปที่โฟลเดอร์โปรเจกต์
            cd /path/to/your/project

            # 2. สร้างไฟล์ .env ใหม่จาก Secrets (กันข้อมูลรั่วไหล)
            # ใช้ > เพื่อทับไฟล์เดิม และ >> เพื่อเขียนต่อท้าย
            echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" > .env
            echo "NEXT_PUBLIC_PAYMENT_API_BASE=${{ secrets.NEXT_PUBLIC_PAYMENT_API_BASE }}" > .env
            echo "NEXT_PUBLIC_PAYMENT_API_KEY=${{ secrets.NEXT_PUBLIC_PAYMENT_API_KEY }}" > .env
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
            echo "API_PREFIX=${{ secrets.API_PREFIX }}" >> .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            echo "FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}" >> .env
            echo "FACEBOOK_APP_SECRET=${{ secrets.FACEBOOK_APP_SECRET }}" >> .env

            # 3. Pull image ใหม่ล่าสุดมา
            docker compose pull

            # 4. รันระบบใหม่
            docker compose up -d

            # 5. ล้างเครื่อง (ลบ image เก่าๆ ทิ้ง)
            docker image prune -f
